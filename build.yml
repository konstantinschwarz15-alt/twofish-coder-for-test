name: Build Android APK

# Startet automatisch bei jedem Push auf main/master,
# oder manuell ueber den "Actions"-Tab auf GitHub ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System-Abhaengigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev openjdk-17-jdk unzip

      - name: Buildozer installieren
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: APK bauen
        run: |
          yes | buildozer -v android debug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: twofishchat-apk
          path: bin/*.apk
